name: CI

on:
  push:
  pull_request:

jobs:
  policy-tests:
    name: Offline DPI policy tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python3 -m unittest -v tests.test_dpi_policy tests.test_dpi_identity tests.test_iec104

  image-build:
    name: Build lab image and resolve pinned dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
