# Runtime hardening shared by every service built from this repository:
# read-only root filesystem (bind-mounted logs/ and certs/ stay writable),
# no privilege escalation, no Linux capabilities. The image runs as uid 10001;
# on a Linux host make logs/ and certs/ writable by that uid.
x-hardened: &hardened
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  # ============================================================================
  # LEVEL 1: BASIC PROCESS CONTROL ZONE (CONTROLLERS)
  # ============================================================================

  openplc:
    image: fdamador/openplc:latest
    platform: linux/amd64
    container_name: plcsentinel-openplc
    restart: unless-stopped
    ports:
      - "8081:8080"  # Web Dashboard (mapped to 8081 to prevent port 8080 collision)
      # Modbus TCP (502) is intentionally NOT published to the host: controllers
      # are reachable only from the DPI gateway over the internal control net, so
      # the Layer-7 conduit cannot be bypassed.
    networks:
      ot-control-net:
        ipv4_address: 10.0.1.10
    healthcheck:
      # The fdamador/openplc image ships Python 2.7 only (no python3/curl/wget),
      # so the probe must use `python` + urllib2.
      test: ["CMD", "python", "-c", "import urllib2; urllib2.urlopen('http://127.0.0.1:8080/login')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  s7-mock-server:
    build: .
    container_name: plcsentinel-s7-controller
    <<: *hardened
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('127.0.0.1', 1102), timeout=2).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    command: python3 -m plcsentinel.servers.s7_mock_server --bind 0.0.0.0 --port 1102
    # S7comm (1102) is intentionally NOT published to the host: the controller is
    # reachable only from the S7 DPI gateway over the internal control net.
    networks:
      ot-control-net:
        ipv4_address: 10.0.1.20

  iec104-mock-server:
    build: .
    container_name: plcsentinel-iec104-rtu
    <<: *hardened
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('127.0.0.1', 24040), timeout=2).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    command: python3 -m plcsentinel.servers.iec104_mock_server --bind 0.0.0.0 --port 24040
    # IEC 104 (24040) is not published to the host: reachable only from the gateway.
    networks:
      ot-control-net:
        ipv4_address: 10.0.1.30

  opcua-secure-server:
    build: .
    container_name: plcsentinel-opcua-server
    <<: *hardened
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('127.0.0.1', 4840), timeout=2).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    command: >
      sh -c "python3 -m plcsentinel.ops.generate_opcua_certs &&
             python3 -m plcsentinel.servers.opcua_secure_server"
    ports:
      - "4840:4840"  # Encrypted OPC UA Server (IEC 62541)
    volumes:
      - ./certs:/app/certs
    networks:
      ot-supervisory-net:
        ipv4_address: 192.168.1.40

  # ============================================================================
  # LAB PKI: one-shot service that mints the CA, gateway and EWS certificates
  # into ./certs (kept if already present). The gateways wait for it.
  # ============================================================================

  gateway-pki:
    build: .
    container_name: plcsentinel-gateway-pki
    <<: *hardened
    restart: "no"
    command: python3 -m plcsentinel.ops.generate_gateway_certs --if-missing
    volumes:
      - ./certs:/app/certs
    networks:
      - ot-supervisory-net

  # ============================================================================
  # CONDUIT C-1: LAYER-7 DEEP PACKET INSPECTION GATEWAYS
  # ============================================================================

  modbus-dpi-proxy:
    build: .
    container_name: plcsentinel-modbus-dpi
    <<: *hardened
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('127.0.0.1', 5020), timeout=2).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    command: >
      python3 -m plcsentinel.gateways.modbus_dpi_proxy
      --listen-host 0.0.0.0
      --listen-port 5020
      --backend-host 10.0.1.10
      --backend-port 502
      --policy config/modbus_policy.json
      --tls-port 802
      --log-file /app/logs/ot_security_events.jsonl
    ports:
      - "5020:5020"  # Sanitized Modbus TCP Gateway (source-address policy)
      - "802:802"    # Modbus/TCP Security: mutual TLS, certificate identity
    volumes:
      - ./logs:/app/logs
      - ./certs:/app/certs:ro
    depends_on:
      openplc:
        condition: service_started
      gateway-pki:
        condition: service_completed_successfully
    networks:
      ot-supervisory-net:
        ipv4_address: 192.168.1.100
      ot-control-net:
        ipv4_address: 10.0.1.100

  s7-dpi-proxy:
    build: .
    container_name: plcsentinel-s7-dpi
    <<: *hardened
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('127.0.0.1', 10200), timeout=2).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    command: >
      python3 -m plcsentinel.gateways.s7_dpi_proxy
      --listen-host 0.0.0.0
      --listen-port 10200
      --backend-host 10.0.1.20
      --backend-port 1102
      --policy config/s7_policy.json
      --tls-port 10202
      --log-file /app/logs/s7_security_events.jsonl
    ports:
      - "10200:10200" # Sanitized Siemens S7comm Gateway (source-address policy)
      - "10202:10202" # Mutual-TLS listener for ews_tls_tunnel.py, certificate identity
    volumes:
      - ./logs:/app/logs
      - ./certs:/app/certs:ro
    depends_on:
      s7-mock-server:
        condition: service_started
      gateway-pki:
        condition: service_completed_successfully
    networks:
      ot-supervisory-net:
        ipv4_address: 192.168.1.101
      ot-control-net:
        ipv4_address: 10.0.1.101

  # ============================================================================
  # LEVEL 2: AUTHORIZED ENGINEERING WORKSTATION (EWS)
  # ============================================================================

  ews:
    build: .
    container_name: plcsentinel-ews
    <<: *hardened
    restart: unless-stopped
    # Idle host parked on the one address the DPI gateways trust for writes.
    # `make test-ews` runs test_ews_authorized.py inside it to prove the
    # allow side of the conduit policy end to end.
    command: sleep infinity
    depends_on:
      - modbus-dpi-proxy
      - s7-dpi-proxy
    networks:
      ot-supervisory-net:
        ipv4_address: 192.168.1.50

  # ============================================================================
  # LEVEL 2 / SOC: UNIFIED OT SOC THREAT DASHBOARD
  # ============================================================================

  iec104-dpi-proxy:
    build: .
    container_name: plcsentinel-iec104-dpi
    <<: *hardened
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('127.0.0.1', 2404), timeout=2).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    command: >
      python3 -m plcsentinel.gateways.iec104_dpi_proxy
      --listen-host 0.0.0.0
      --listen-port 2404
      --backend-host 10.0.1.30
      --backend-port 24040
      --policy config/iec104_policy.json
      --tls-port 24040
      --log-file /app/logs/iec104_security_events.jsonl
    ports:
      - "2404:2404" # Sanitized IEC 60870-5-104 telecontrol gateway
    volumes:
      - ./logs:/app/logs
      - ./certs:/app/certs:ro
    depends_on:
      iec104-mock-server:
        condition: service_started
      gateway-pki:
        condition: service_completed_successfully
    networks:
      ot-supervisory-net:
        ipv4_address: 192.168.1.102
      ot-control-net:
        ipv4_address: 10.0.1.102

  soc-dashboard:
    build: .
    container_name: plcsentinel-soc-dashboard
    <<: *hardened
    restart: unless-stopped
    command: python3 -m plcsentinel.ops.soc_dashboard --watch --interval 5
    volumes:
      - ./logs:/app/logs:ro
    depends_on:
      - modbus-dpi-proxy
      - s7-dpi-proxy
      - iec104-dpi-proxy
    networks:
      ot-supervisory-net:
        ipv4_address: 192.168.1.150

# ==============================================================================
# NETWORK BRIDGING & SEGMENTATION (PURDUE MODEL / IEC 62443-3-2)
# ==============================================================================

networks:
  # Level 2 Supervisory Network (HMI / Engineering Workstations)
  ot-supervisory-net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 192.168.1.0/24
          gateway: 192.168.1.1

  # Level 1 Basic Control Network (Controller Bus).
  # The control-protocol ports (Modbus 502, S7 1102) are deliberately NOT
  # published to the host, so the only ingress to a controller is via the
  # dual-homed DPI gateways. (A full air-gap via `internal: true` is avoided
  # here because OpenPLC must publish its 8081 web UI for lab provisioning;
  # publishing a port requires a non-internal network.)
  ot-control-net:
    driver: bridge
    internal: false
    ipam:
      driver: default
      config:
        - subnet: 10.0.1.0/24
          gateway: 10.0.1.1
