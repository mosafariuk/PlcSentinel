services:
  # ============================================================================
  # LEVEL 1: BASIC PROCESS CONTROL ZONE (CONTROLLERS)
  # ============================================================================

  openplc:
    image: fdamador/openplc:latest
    platform: linux/amd64
    container_name: plcsentinel-openplc
    restart: unless-stopped
    ports:
      - "8081:8080"  # Web Dashboard (mapped to 8081 to prevent port 8080 collision)
      # Modbus TCP (502) is intentionally NOT published to the host: controllers
      # are reachable only from the DPI gateway over the internal control net, so
      # the Layer-7 conduit cannot be bypassed.
    networks:
      ot-control-net:
        ipv4_address: 10.0.1.10
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/login')"]
      interval: 10s
      timeout: 5s
      retries: 3

  s7-mock-server:
    build: .
    container_name: plcsentinel-s7-controller
    restart: unless-stopped
    command: python3 s7_mock_server.py --bind 0.0.0.0 --port 1102
    # S7comm (1102) is intentionally NOT published to the host: the controller is
    # reachable only from the S7 DPI gateway over the internal control net.
    networks:
      ot-control-net:
        ipv4_address: 10.0.1.20

  opcua-secure-server:
    build: .
    container_name: plcsentinel-opcua-server
    restart: unless-stopped
    command: >
      sh -c "python3 generate_opcua_certs.py &&
             python3 opcua_secure_server.py"
    ports:
      - "4840:4840"  # Encrypted OPC UA Server (IEC 62541)
    volumes:
      - ./certs:/app/certs
    networks:
      ot-supervisory-net:
        ipv4_address: 192.168.1.40

  # ============================================================================
  # CONDUIT C-1: LAYER-7 DEEP PACKET INSPECTION GATEWAYS
  # ============================================================================

  modbus-dpi-proxy:
    build: .
    container_name: plcsentinel-modbus-dpi
    restart: unless-stopped
    command: >
      python3 modbus_dpi_proxy.py
      --listen-host 0.0.0.0
      --listen-port 5020
      --backend-host 10.0.1.10
      --backend-port 502
      --authorized-ip 192.168.1.50
      --log-file /app/logs/ot_security_events.jsonl
    ports:
      - "5020:5020"  # Sanitized Modbus TCP Gateway
    volumes:
      - ./logs:/app/logs
    depends_on:
      openplc:
        condition: service_started
    networks:
      ot-supervisory-net:
        ipv4_address: 192.168.1.100
      ot-control-net:
        ipv4_address: 10.0.1.100

  s7-dpi-proxy:
    build: .
    container_name: plcsentinel-s7-dpi
    restart: unless-stopped
    command: >
      python3 s7_dpi_proxy.py
      --listen-host 0.0.0.0
      --listen-port 10200
      --backend-host 10.0.1.20
      --backend-port 1102
      --authorized-ews 192.168.1.50
      --log-file /app/logs/s7_security_events.jsonl
    ports:
      - "10200:10200" # Sanitized Siemens S7comm Gateway
    volumes:
      - ./logs:/app/logs
    depends_on:
      s7-mock-server:
        condition: service_started
    networks:
      ot-supervisory-net:
        ipv4_address: 192.168.1.101
      ot-control-net:
        ipv4_address: 10.0.1.101

  # ============================================================================
  # LEVEL 2 / SOC: UNIFIED OT SOC THREAT DASHBOARD
  # ============================================================================

  soc-dashboard:
    build: .
    container_name: plcsentinel-soc-dashboard
    restart: unless-stopped
    command: python3 soc_dashboard.py --watch --interval 5
    volumes:
      - ./logs:/app/logs:ro
    depends_on:
      - modbus-dpi-proxy
      - s7-dpi-proxy
    networks:
      ot-supervisory-net:
        ipv4_address: 192.168.1.150

# ==============================================================================
# NETWORK BRIDGING & SEGMENTATION (PURDUE MODEL / IEC 62443-3-2)
# ==============================================================================

networks:
  # Level 2 Supervisory Network (HMI / Engineering Workstations)
  ot-supervisory-net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 192.168.1.0/24
          gateway: 192.168.1.1

  # Level 1 Basic Control Network (Controller Bus).
  # The control-protocol ports (Modbus 502, S7 1102) are deliberately NOT
  # published to the host, so the only ingress to a controller is via the
  # dual-homed DPI gateways. (A full air-gap via `internal: true` is avoided
  # here because OpenPLC must publish its 8081 web UI for lab provisioning;
  # publishing a port requires a non-internal network.)
  ot-control-net:
    driver: bridge
    internal: false
    ipam:
      driver: default
      config:
        - subnet: 10.0.1.0/24
          gateway: 10.0.1.1
